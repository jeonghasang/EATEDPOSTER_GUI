<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대체부품 추천 프레임워크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --navy:#094B99; --blue:#0070C0; --ink:#12233b; --sub:#51627a; --line:#d5deea;
  --bg:#f3f6fa; --card:#ffffff; --tint:#e8f0fa; --pass:#1e8a57; --passbg:#e3f4ea; --fail:#c2410c; --failbg:#fbeae2; --warn:#a16207;
  --sans:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --ink:#e4ebf5; --sub:#9aabc2; --line:#2b3a50; --bg:#0e1622; --card:#152033; --tint:#1b2c45;
  --navy:#6ea8ff; --blue:#4ea3ff; --pass:#4cc98a; --passbg:#143325; --fail:#ff8a5c; --failbg:#3a1f16; --warn:#e3b341;}}
:root[data-theme="dark"]{
  color-scheme:dark; --ink:#e4ebf5; --sub:#9aabc2; --line:#2b3a50; --bg:#0e1622; --card:#152033; --tint:#1b2c45;
  --navy:#6ea8ff; --blue:#4ea3ff; --pass:#4cc98a; --passbg:#143325; --fail:#ff8a5c; --failbg:#3a1f16; --warn:#e3b341;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45;padding-inline:16px;padding-block:14px}
.app{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:250px 1fr;gap:14px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
/* left rail */
.rail{display:flex;flex-direction:column;gap:10px}
.brand{background:var(--navy);color:#fff;border-radius:8px;padding:10px 12px}
:root[data-theme="dark"] .brand{color:#0b1320}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand{color:#0b1320}}
.brand b{display:block;font-size:15px;font-weight:900;letter-spacing:-.01em}
.brand span{font-size:11px;opacity:.85}
.lbl{font-size:10.5px;font-weight:700;color:var(--sub);letter-spacing:.06em;text-transform:uppercase}
.parts{display:grid;gap:6px}
.part{all:unset;cursor:pointer;display:block;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px}
.part:focus-visible,.step:focus-visible,.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.part .mono{font-weight:600;font-size:13px;color:var(--ink)}
.part small{display:block;color:var(--sub);font-size:11px}
.part[aria-pressed="true"]{border-color:var(--blue);background:var(--tint)}
.ctrls{display:flex;gap:6px}
.btn{all:unset;cursor:pointer;flex:1;text-align:center;font-weight:700;font-size:12.5px;padding:7px 0;border-radius:7px;border:1.5px solid var(--blue);color:var(--blue);background:var(--card)}
.btn.primary{background:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0b1320}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1320}}
.funnel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:5px}
.frow{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:6px;font-size:11px;color:var(--sub);opacity:.35;transition:opacity .3s}
.frow.on{opacity:1}
.fbar{height:9px;border-radius:2px;background:var(--blue);transition:width .6s ease}
.frow.last .fbar{background:var(--pass)}
.frow b{color:var(--ink);text-align:right;font-family:var(--mono);font-size:11.5px}
/* main */
.main{display:flex;flex-direction:column;gap:10px;min-width:0}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{all:unset;cursor:pointer;position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:6px 9px 6px 34px;min-height:38px}
.step i{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:11px;background:var(--tint);color:var(--navy)}
.step b{display:block;font-size:12px;line-height:1.25}
.step small{font-size:10.5px;color:var(--sub)}
.step.done i{background:var(--pass);color:#fff}
.step.cur{border-color:var(--blue);background:var(--tint)}
.step.cur i{background:var(--blue);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:268px;display:flex;flex-direction:column;gap:9px}
.ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph h2{margin:0;font-size:15px;font-weight:900;color:var(--navy);text-wrap:balance}
.ph .src{font-size:10.5px;color:var(--sub)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--tint);color:var(--navy);vertical-align:1px}
.tag.m{background:#fff4d6;color:var(--warn)}
:root[data-theme="dark"] .tag.m{background:#3a2e10}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.m{background:#3a2e10}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.kv{border:1px solid var(--line);border-radius:7px;padding:6px 10px;flex:1;min-width:150px}
.kv .lbl{font-size:10px;text-transform:none;letter-spacing:.02em}
.kv div{font-size:13px;font-weight:700}
.big{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--navy);line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--bg)}
.chip.mono{font-size:10.5px}
.cgrp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cg{border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.cg h4{margin:0 0 4px;font-size:11.5px;color:var(--navy)}
.cg ul{margin:0;padding-left:14px;font-size:11.2px}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.arrow{color:var(--sub);font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:15px;height:15px;border-radius:3px;background:var(--failbg);border:1.5px solid var(--fail);cursor:help}
.dot.p{background:var(--pass);border-color:var(--pass)}
.dot.sel{outline:2px solid var(--ink);outline-offset:1px}
.info{font-size:11.5px;border-left:3px solid var(--blue);padding:4px 9px;background:var(--bg);border-radius:0 6px 6px 0;min-height:28px}
.info .mono{font-weight:600}
.split{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th{font-size:10px;color:var(--sub);font-weight:700;text-align:right;padding:3px 6px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:2.5px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
tr.base td{color:var(--sub);font-style:italic}
tr.top td{background:var(--passbg);font-weight:700}
.neg{color:var(--pass)} .pos{color:var(--fail)}
.scb{display:inline-block;height:7px;border-radius:2px;background:var(--blue);vertical-align:1px;margin-right:4px}
tr.top .scb{background:var(--pass)}
.foot{grid-column:1/-1;font-size:10.5px;color:var(--sub);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}
.pill.p{background:var(--passbg);color:var(--pass)} .pill.f{background:var(--failbg);color:var(--fail)}
.fade{animation:fd .35s ease}
@keyframes fd{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}.fbar{transition:none}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(5,minmax(0,1fr))}
  .step{padding:30px 4px 6px;text-align:center}
  .step i{left:50%;top:6px;transform:translateX(-50%)}
  .step small{display:none}
  .step b{font-size:10.5px}
  .split,.cgrp{grid-template-columns:1fr}
  .parts{grid-template-columns:1fr 1fr}
}
</style></head><body style="margin:0">

    <div class="lbl">① 대상 부품 선택</div>
    <div class="parts" id="parts"></div>
    <div class="ctrls">

    <div class="lbl">후보 축소 과정</div>
